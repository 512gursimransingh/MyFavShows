<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TV Show Episode Spinner with Trivia</title>

  <!-- Link CSS -->
  <link rel="stylesheet" href="style.css" />

  <!-- Confetti library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>

<body class="dark-mode">
  <h1>TV Show Episode Spinner 🎬</h1>
  <button onclick="spin()">Spin Random Episode 🎲</button>

  <div id="resultModal">
    <div id="resultContent">
      <button id="closeBtn" onclick="closePopup()">✖</button>
    </div>
  </div>

  <button id="modeToggle" onclick="toggleMode()">🌙 Dark/Light Mode</button>

  <!-- Link JavaScript -->
  <script src="script.js"></script>
</body>
</html>
