<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TV Show Episode Spinner with Trivia</title>
<style>
  :root {
    --bg-light: #f0f0f0;
    --bg-dark: #1e1e1e;
    --text-light: #1e1e1e;
    --text-dark: #f0f0f0;
    --popup-bg-light: #ffffff;
    --popup-bg-dark: #2c2c2c;
    --btn-bg: #ff6f61;
    --btn-text: #fff;
  }
  body {
    font-family: Arial, sans-serif;
    background-color: var(--bg-light);
    color: var(--text-light);
    margin: 0;
    padding: 0;
    transition: background 0.3s, color 0.3s;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  body.dark-mode {
    background-color: var(--bg-dark);
    color: var(--text-dark);
  }
  h1 { text-align: center; margin:20px 0; }
  button {
    background-color: var(--btn-bg);
    color: var(--btn-text);
    padding: 15px 25px;
    font-size: 18px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: transform 0.2s;
    box-shadow: 0 5px 15px rgba(0,0,0,0.3);
  }
  button:active { transform: translateY(4px) rotateX(5deg); }
  #resultModal {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.5);
    z-index: 1000;
  }
  #resultModal.show { display: flex; }
  #resultContent {
    background-color: var(--popup-bg-light);
    color: var(--text-light);
    padding: 30px;
    border-radius: 20px;
    text-align: center;
    font-size: 22px;
    max-width: 500px;
    width: 90%;
    transform-style: preserve-3d;
    perspective: 1000px;
    transition: background-color 0.3s, color 0.3s;
  }
  body.dark-mode #resultContent {
    background-color: var(--popup-bg-dark);
    color: var(--text-dark);
  }
  #closeBtn {
    position: absolute;
    top: 10px; right: 15px;
    background: transparent;
    color: inherit;
    font-size: 25px;
    border: none;
    cursor: pointer;
  }
  #modeToggle {
    position: fixed;
    bottom: 20px;
    left:50%;
    transform: translateX(-50%);
    background-color: var(--btn-bg);
    color: var(--btn-text);
    padding:12px 20px;
    font-size:18px;
    border:none;
    border-radius:25px;
    cursor:pointer;
    box-shadow:0 4px 15px rgba(0,0,0,0.3);
    transition:transform 0.2s,box-shadow 0.2s;
  }
  #modeToggle:hover {
    transform: translateX(-50%) scale(1.1);
    box-shadow:0 6px 20px rgba(0,0,0,0.4);
  }
  .emoji {
    font-size: 50px;
    display: block;
    margin-bottom: 10px;
  }
  em {
    display: block;
    margin-top: 15px;
    font-size: 18px;
    color: #555;
  }
  body.dark-mode em { color: #ccc; }
  @media (max-width: 600px) {
    #resultContent {
      width: 95%;
      font-size: 18px;
      padding: 20px;
    }
  }
</style>
</head>
<body class="dark-mode">
<h1>TV Show Episode Spinner 🎬</h1>
<button onclick="spin()">Spin Random Episode 🎲</button>

<div id="resultModal">
  <div id="resultContent">
    <button id="closeBtn" onclick="closePopup()">✖</button>
  </div>
</div>

<button id="modeToggle" onclick="toggleMode()">🌙 Dark/Light Mode</button>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<script>
const shows = {
  "Friends": {
    emoji: "🛋️",
    seasons: {
      1: { count:24, trivia:[
        "Introduces all six main characters and their dynamic.",
        "Rachel starts her new life after leaving Barry at the altar."
      ]},
      2: { count:24, trivia:[
        "Ross deals with jealousy and new relationships.",
        "Monica and Richard’s romance begins."
      ]},
      3: { count:25, trivia:[
        "The group deals with break‑ups and more adult challenges.",
        "Ross says the wrong name at the altar."
      ]},
      4: { count:24, trivia:[
        "European vacation episode and major weddings.",
        "The One with the Embryos quiz episode becomes a fan favourite."
      ]},
      5: { count:24, trivia:[
        "Monica and Chandler finally get together.",
        "Ross and Rachel's 'We were on a break' saga continues."
      ]},
      6: { count:25, trivia:[
        "Monica and Chandler adopt a baby.",
        "Joey’s acting career faces changes."
      ]},
      7: { count:24, trivia:[
        "Monica and Chandler’s wedding.",
        "Rachel realises her feelings for Ross."
      ]},
      8: { count:24, trivia:[
        "Pregnancy, secret, and new beginnings.",
        "The diner flashbacks episode is a highlight."
      ]},
      9: { count:24, trivia:[
        "Mature arcs—career moves and family themes.",
        "Joey’s character starts to grow more independent."
      ]},
      10:{ count:18, trivia:[
        "Final endings and moving on.",
        "Friends say goodbye in iconic series finale."
      ]}
    }
  },
  "Big Bang Theory": {
    emoji: "🔬",
    seasons: {
      1: { count:17, trivia:[
        "Introduces Sheldon and Leonard and their quirks.",
        "Raj is unable to talk to women without alcohol."
      ]},
      2: { count:23, trivia:[
        "Penny’s life and the guys’ friendship deepen.",
        "Howard’s relationship with Bernadette starts."
      ]},
      3: { count:23, trivia:[
        "Sheldon’s mother visits and major character arcs develop.",
        "Leonard and Penny’s relationship faces obstacles."
      ]},
      4: { count:24, trivia:[
        "Guest stars and Sheldon’s fears dominate plotlines.",
        "The guys enter new career phases."
      ]},
      5: { count:24, trivia:[
        "Big breakthroughs and character growth.",
        "Amy and Sheldon’s evolving relationship begins."
      ]},
      6: { count:24, trivia:[
        "Major life changes for the group.",
        "Howard returns from space."
      ]},
      7: { count:24, trivia:[
        "More life events and career shifts.",
        "Raj begins to come into his own."
      ]},
      8: { count:24, trivia:[
        "Resolution of major arcs and growth.",
        "Penny makes big career decisions."
      ]},
      9: { count:24, trivia:[
        "Deals with change and endings.",
        "Leonard and Penny marriage continues."
      ]},
      10:{ count:24, trivia:[
        "The creative peak of the show.",
        "Sheldon and Amy win Big Bang Award."
      ]},
      11:{ count:24, trivia:[
        "Final chapters begin.",
        "The group adjusts to new roles and life."
      ]},
      12:{ count:24, trivia:[
        "Series finale—goodbyes and final arcs.",
        "The finale airs and the group moves forward."
      ]}
    }
  }
};

const resultModal = document.getElementById("resultModal");
const resultContent = document.getElementById("resultContent");
let spinSound = new Audio("https://www.soundjay.com/button/beep-07.wav");

function spin() {
  spinSound.currentTime = 0;
  spinSound.play().catch(()=>{});
  if(navigator.vibrate) navigator.vibrate(150);

  const showNames = Object.keys(shows);
  const show = showNames[Math.floor(Math.random() * showNames.length)];
  const seasons = Object.keys(shows[show].seasons);
  const season = seasons[Math.floor(Math.random() * seasons.length)];
  const episodesInSeason = shows[show].seasons[season].count;
  const episode = Math.floor(Math.random() * episodesInSeason) + 1;

  const seasonTrivia = shows[show].seasons[season].trivia;
  const triviaHTML = (seasonTrivia && seasonTrivia.length > 0) ?
      `<em><strong>Season Trivia:</strong> ${seasonTrivia[Math.floor(Math.random()*seasonTrivia.length)]}</em>` : '';

  resultContent.innerHTML = `<button id="closeBtn" onclick="closePopup()">✖</button>
      <span class="emoji">${shows[show].emoji}</span>
      Watch <strong>${show}</strong><br>
      Season ${season}, Episode ${episode}
      ${triviaHTML}`;

  resultModal.classList.add("show");
  confetti({ particleCount:150, spread:70, origin:{y:0.6} });
}

function closePopup() {
  resultModal.classList.remove("show");
}

function toggleMode() {
  document.body.classList.toggle("dark-mode");
}
</script>
</body>
</html>
